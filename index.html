<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
body{ background:#FAF7FD; font-family:'Sarabun',sans-serif; padding:20px; color:#5E5473; }
.container{ max-width:900px; margin:auto; }
.card{ background:white; padding:30px; border-radius:25px; box-shadow: 0 8px 25px rgba(0,0,0,.08); }
h1{ text-align:center; color:#7D65A7; font-weight:700; }
.guide{ background:#F2EBFB; padding:20px; border-radius:15px; margin-top:25px; border-left:6px solid #B59AD9; line-height:1.9; }
.guide-title{ font-size:18px; font-weight:bold; margin-bottom:10px; color:#7D65A7; }
.section{ margin-top:35px; padding:20px; background:#F7F1FC; border-radius:15px; }
.question{ padding:15px; margin-top:15px; background:white; border-radius:12px; }
.rating{ display:flex; gap:20px; margin-top:10px; flex-wrap:wrap; }
label{ font-weight:bold; display:block; }
select, textarea{ width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin-top:8px; font-family:'Sarabun',sans-serif; font-size:14px; }
button{ margin-top:30px; width:100%; padding:15px; border:none; border-radius:15px; background:#8E73B8; color:white; font-size:16px; font-family:'Sarabun',sans-serif; cursor:pointer; }
button:hover{ opacity:.9; }
</style>
</head>
<body>

<div class="container">
<div class="card">
<div id="messageBox" style="display:none; margin-top:20px; padding:15px; background:#FFF4F7; border-left:5px solid #C78DBE; border-radius:10px; white-space:pre-line; color:#5E5473; font-weight:500;"></div>

<h1>🌷 แบบประเมินความพึงพอใจโครงการ KM</h1>

<label>เพศ</label>
<select id="gender">
<option>ชาย</option>
<option>หญิง</option>
</select>

<br>

<label>สถานะ</label>
<select id="status">
<option>ผู้บริหาร</option>
<option>อาจารย์</option>
<option>บุคลากรสายสนับสนุน</option>
</select>

<div class="guide">
<div class="guide-title">ระดับความพึงพอใจ</div>
<b>5</b> = มากที่สุด หรือ ดีมาก<br>
<b>4</b> = มาก หรือ ดี<br>
<b>3</b> = ปานกลาง หรือ พอใช้<br>
<b>2</b> = น้อย หรือ ต่ำกว่ามาตรฐาน<br>
<b>1</b> = น้อยที่สุด หรือ ต้องปรับปรุงแก้ไข
</div>

<div id="questions"></div>

<div class="section">
<h3>ส่วนที่ 3 ข้อเสนอแนะ</h3>
<div class="question">
<label>3.1 สิ่งที่ท่านจะนำไปใช้ประโยชน์จากการร่วมโครงการในครั้งนี้</label>
<textarea id="benefit" rows="5"></textarea>
</div>
<div class="question">
<label>3.2 คำเสนอแนะเพื่อการพัฒนาในการจัดโครงการครั้งต่อไป (ในส่วนของคณะฯ)</label>
<textarea id="suggestion" rows="5"></textarea>
</div>
</div>

<button id="submitBtn" onclick="submitForm()">ส่งแบบประเมิน</button>
</div>
</div>

<script>
const sections = [
  {
    title: "1. กระบวนการ ขั้นตอนในการจัดโครงการ",
    items: [
      "1.1 การประชาสัมพันธ์โครงการ",
      "1.2 ความเหมาะสมของสถานที่",
      "1.3 ความเหมาะสมของระยะเวลา",
      "1.4 ความเหมาะสมของกิจกรรม"
    ]
  },
  {
    title: "2. การอำนวยความสะดวก",
    items: [
      "2.1 โสตทัศนูปกรณ์",
      "2.2 อาหารและเครื่องดื่ม"
    ]
  },
  {
    title: "3. คุณภาพการดำเนินโครงการ",
    items: [
      "3.1 ท่านได้รับความรู้ แนวคิด ทักษะและประสบการณ์ใหม่จากโครงการ",
      "3.2 ท่านสามารถนำสิ่งที่ได้รับไปใช้ในการปฏิบัติงาน",
      "3.3 สิ่งที่ได้รับตรงตามความคาดหวัง",
      "3.4 โครงการนี้สามารถพัฒนาความสามารถของท่าน",
      "3.5 การนำเสนอของวิทยากร (ผศ.ดร.ปะการัง ชื่นจิต)",
      "3.6 ประโยชน์ที่ได้รับ"
    ]
  },
  {
    title: "4. ความพึงพอใจต่อภาพรวม",
    items: [
      "4.1 ความพึงพอใจของท่านต่อภาพรวมของโครงการ"
    ]
  }
];

let html = '';
sections.forEach((sec, s) => {
  html += `<div class="section"><h3>${sec.title}</h3>`;
  sec.items.forEach((q, i) => {
    html += `
    <div class="question">
      <label>${q}</label>
      <div class="rating">
        <label><input type="radio" name="q${s}_${i}" value="5" required> 5</label>
        <label><input type="radio" name="q${s}_${i}" value="4"> 4</label>
        <label><input type="radio" name="q${s}_${i}" value="3"> 3</label>
        <label><input type="radio" name="q${s}_${i}" value="2"> 2</label>
        <label><input type="radio" name="q${s}_${i}" value="1"> 1</label>
      </div>
    </div>
    `;
  });
  html += "</div>";
});
document.getElementById("questions").innerHTML = html;

function submitForm(){
  let answers = [];
  let unanswered = [];

  sections.forEach((sec, s) => {
    sec.items.forEach((q, i) => {
      let selected = document.querySelector(`input[name="q${s}_${i}"]:checked`);
      if(selected){ 
        answers.push(selected.value); 
      } else { 
        unanswered.push(q); 
      }
    });
  });

  const box = document.getElementById("messageBox");
  const btn = document.getElementById("submitBtn");

  if(unanswered.length > 0){
    box.style.display = "block";
    box.style.background = "#FFF4F7";
    box.style.borderLeft = "5px solid #C78DBE";
    box.innerText = "⚠️ กรุณาตอบระดับความพึงพอใจให้ครบทุกข้อ\n\nข้อที่ยังไม่ได้ตอบ:\n\n" + unanswered.join("\n");
    box.scrollIntoView({ behavior: "smooth" });
    return;
  }

  btn.disabled = true;
  btn.innerText = "กำลังส่งแบบประเมิน...";

  const data = {
    gender: document.getElementById("gender").value,
    status: document.getElementById("status").value,
    scores: answers,
    benefit: document.getElementById("benefit").value,
    suggestion: document.getElementById("suggestion").value
  };

  const webAppUrl = "https://script.google.com/macros/s/AKfycbwa7-eWw-MmYa7KdlUMPVRjT0PMpC77j9JVKGULOPv3JqG6sNmtXZVVoFp3g-Q7a_9X/exec";

  fetch(webAppUrl, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data)
  })
  .then(() => {
    box.style.display = "block";
    box.style.background = "#EEF9F0";
    box.style.borderLeft = "5px solid #7BC47F";
    box.innerText = "✅ ส่งแบบประเมินเรียบร้อย\n\nขอบคุณสำหรับการให้ข้อมูลและข้อเสนอแนะ";
    box.scrollIntoView({ behavior: "smooth" });
    btn.innerText = "ส่งเรียบร้อยแล้ว";
  })
  .catch(error => {
    console.error("Error:", error);
    box.style.display = "block";
    box.style.background = "#FFF4F7";
    box.style.borderLeft = "5px solid #C78DBE";
    box.innerText = "⚠️ เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง";
    btn.disabled = false;
    btn.innerText = "ส่งแบบประเมิน";
  });
}
</script>
</body>
</html>
